name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize all versions without cancelling an upload already in progress.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  provenance:
    if: github.repository == 'riccardogabellone/ordered-btree' && github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0 # Peel annotated tags and prove ancestry in origin/main.
          persist-credentials: false
      - name: Validate exact release tag and protected-main source
        id: source
        env:
          RELEASE_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 tools/check_release.py
          python3 tools/release.py provenance --ref "$RELEASE_REF" --sha "$EVENT_SHA" \
            --report results/provenance.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/provenance.json
          if-no-files-found: ignore
          retention-days: 90

  ci:
    needs: provenance
    permissions:
      contents: read
      actions: read # Allow reusable CI to locate retained artifacts on recovery.
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.provenance.outputs.source_sha }}

  publish-testpypi:
    needs: [provenance, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ordered-btree/${{ needs.provenance.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.ci.outputs.source_sha }}
      MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.distribution_artifact_id }}
          merge-multiple: true
          path: original-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: evidence
      - name: Stage only missing exact-hash originals for TestPyPI
        id: stage
        run: |
          python3 tools/release.py stage --index testpypi --dist original-dist --sha "$SOURCE_SHA" \
            --manifest evidence/manifest.json --manifest-sha256 "$MANIFEST_SHA256" \
            --upload-dir upload --report results/testpypi-stage.json >> "$GITHUB_OUTPUT"
      # OIDC must run directly in release.yml: both Trusted Publishers bind it.
      - name: Publish to TestPyPI with attestations
        if: steps.stage.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          attestations: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testpypi-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  verify-testpypi:
    needs: [ci, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.ci.outputs.source_sha }}
      MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.15'
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.distribution_artifact_id }}
          merge-multiple: true
          path: original-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: evidence
      - name: Verify indexed hashes, downloaded bytes and token-free installed package
        run: |
          python3 tools/release.py verify-index --index testpypi --dist original-dist --sha "$SOURCE_SHA" \
            --manifest evidence/manifest.json --manifest-sha256 "$MANIFEST_SHA256" \
            --report results/testpypi-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testpypi-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    # This dependency must finish BEFORE the protected environment asks for approval.
    needs: [provenance, ci, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/ordered-btree/${{ needs.provenance.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.ci.outputs.source_sha }}
      MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.distribution_artifact_id }}
          merge-multiple: true
          path: original-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: evidence
      - name: Stage only missing exact-hash originals for PyPI
        id: stage
        run: |
          python3 tools/release.py stage --index pypi --dist original-dist --sha "$SOURCE_SHA" \
            --manifest evidence/manifest.json --manifest-sha256 "$MANIFEST_SHA256" \
            --upload-dir upload --report results/pypi-stage.json >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI with attestations
        if: steps.stage.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/
          attestations: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pypi-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  verify-pypi:
    needs: [ci, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.ci.outputs.source_sha }}
      MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.15'
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.distribution_artifact_id }}
          merge-multiple: true
          path: original-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: evidence
      - name: Verify production hashes, isolated import, version and GitHub backlinks
        run: |
          python3 tools/release.py verify-index --index pypi --dist original-dist --sha "$SOURCE_SHA" \
            --manifest evidence/manifest.json --manifest-sha256 "$MANIFEST_SHA256" \
            --report results/pypi-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pypi-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 90

  github-release:
    needs: [provenance, ci, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Only release finalization can write repository contents.
    env:
      SOURCE_SHA: ${{ needs.ci.outputs.source_sha }}
      MANIFEST_SHA256: ${{ needs.ci.outputs.manifest_sha256 }}
      VERSION: ${{ needs.provenance.outputs.version }}
      TAG: ${{ needs.provenance.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.distribution_artifact_id }}
          merge-multiple: true
          path: original-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.ci.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: evidence
      - name: Recheck retained originals before attaching release assets
        run: |
          python3 tools/release.py check --dist original-dist --sha "$SOURCE_SHA" \
            --manifest evidence/manifest.json --manifest-sha256 "$MANIFEST_SHA256"
          (cd original-dist && sha256sum --check --strict ../evidence/SHA256SUMS)
      - name: Create release with verified files and live reciprocal PyPI link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.txt"
          printf '## ordered-btree %s\n\n' "$VERSION" > "$notes"
          printf 'Verified source: `%s`\n\n' "$SOURCE_SHA" >> "$notes"
          printf 'Install: `python -m pip install ordered-btree==%s`\n\n' "$VERSION" >> "$notes"
          printf '[PyPI](https://pypi.org/project/ordered-btree/%s/) · [Changelog](https://github.com/riccardogabellone/ordered-btree/blob/%s/CHANGELOG.md)\n\n' "$VERSION" "$TAG" >> "$notes"
          printf 'Pre-1.0 API: pin a tested version. Wheel and sdist hashes and installed metadata were verified on both indexes before this release.\n' >> "$notes"
          gh release create "$TAG" original-dist/* evidence/manifest.json evidence/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" \
            --title "ordered-btree $VERSION" --notes-file "$notes"
          # Updating the repository homepage requires administration:write, not
          # contents:write. The owner sets that live PyPI link separately afterward.
